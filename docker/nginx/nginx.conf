# Sofa edge: same-origin SPA + /api → Nest.
# Local: HTTP on :8089 (AUTH_COOKIE_SECURE=false). Prod: terminate TLS here (or upstream)
# with real certs / mkcert volume and set AUTH_COOKIE_SECURE=true + PUBLIC_APP_URL=https://...
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 64m;

  # Nest API (host machine when Nest runs outside Compose)
  upstream sofa_api {
    server host.docker.internal:8083;
  }

  # Vite SPA (HMR) behind nginx so the browser origin stays nginx
  upstream sofa_spa {
    server host.docker.internal:5173;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name localhost;

    # API + BFF auth (cookies Path=/api)
    location /api/ {
      proxy_pass http://sofa_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_pass_header Set-Cookie;
    }

    # SuperTokens recipe APIs (`appInfo.apiBasePath`, default /auth).
    # SPA Google OAuth callback is /login/callback/google (not under /auth/).
    location /auth/ {
      proxy_pass http://sofa_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_pass_header Set-Cookie;
    }

    # Health probes (unversioned on Nest)
    location /health {
      proxy_pass http://sofa_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA (Vite in local; static files can replace this in prod images)
    location / {
      proxy_pass http://sofa_spa;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

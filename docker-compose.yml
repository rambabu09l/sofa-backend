services:
  mysql:
    image: mysql:8.4
    container_name: sofa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sofa}
      MYSQL_USER: ${MYSQL_USER:-sofa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sofa_secret}
    ports:
      - '${MYSQL_PORT:-3308}:3306'
    volumes:
      - sofa_mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: sofa-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6382}:6379'
    volumes:
      - sofa_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 20

  # Malware scanning for uploads (clamd TCP).
  # Official image is amd64-only; on Apple Silicon Docker runs via qemu.
  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    container_name: sofa-clamav
    restart: unless-stopped
    ports:
      - '${CLAMAV_PORT:-3311}:3310'
    volumes:
      - sofa_clamav:/var/lib/clamav
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG',
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  # Private S3-compatible object storage for document quarantine/accepted.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sofa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '${MINIO_API_PORT:-9010}:9000'
      - '${MINIO_CONSOLE_PORT:-9011}:9001'
    volumes:
      - sofa_minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio-init:
    # Docker Hub no longer serves minio/mc RELEASE tags; use local/latest.
    image: minio/mc:latest
    pull_policy: if_not_present
    container_name: sofa-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set none local/$${S3_BUCKET};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sofa-documents}
    restart: 'no'

  # Local SMTP sink for dev email (captures mail, never delivers it).
  # Web UI: http://127.0.0.1:8026 — Nest on the host uses SMTP_HOST=127.0.0.1, SMTP_PORT=1026.
  mailpit:
    image: axllent/mailpit:latest
    container_name: sofa-mailpit
    restart: unless-stopped
    environment:
      # Accept any AUTH credentials so the existing SMTP_USERNAME/SMTP_PASSWORD keep working.
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025'

  # Public edge: same-origin SPA + /api → Nest (browser always hits nginx).
  nginx:
    image: nginx:1.27-alpine
    container_name: sofa-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-8089}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/health/live || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Async document scan messages (KRaft single-node).
  kafka:
    image: apache/kafka:3.9.0
    container_name: sofa-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Kafka requires a base64 UUID cluster id (not an arbitrary string).
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - '${KAFKA_PORT:-9094}:9092'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null',
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # SuperTokens Core DB (PostgreSQL only — Core 11+ dropped MySQL).
  # Private to Compose; Nest on the host reaches Core via published 127.0.0.1:3567.
  postgres-supertokens:
    image: postgres:16-alpine
    container_name: sofa-postgres-supertokens
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPERTOKENS_DB_USER:-supertokens}
      POSTGRES_PASSWORD: ${SUPERTOKENS_DB_PASSWORD:-supertokens_secret}
      POSTGRES_DB: ${SUPERTOKENS_DB_NAME:-supertokens}
    volumes:
      - sofa_postgres_supertokens:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # SuperTokens Core — never expose publicly; bind localhost only.
  # Pin immutable tags in prod (avoid :latest).
  # @see https://supertokens.com/docs/deployment/self-host-supertokens
  supertokens:
    image: ${SUPERTOKENS_IMAGE:-supertokens/supertokens-postgresql:12.5.0}
    container_name: sofa-supertokens
    restart: unless-stopped
    depends_on:
      postgres-supertokens:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${SUPERTOKENS_DB_USER:-supertokens}:${SUPERTOKENS_DB_PASSWORD:-supertokens_secret}@postgres-supertokens:5432/${SUPERTOKENS_DB_NAME:-supertokens}
      API_KEYS: ${SUPERTOKENS_API_KEY:?Set SUPERTOKENS_API_KEY (openssl rand -hex 32)}
      # Access token lifetime in seconds (Core-owned; Session.init cannot override).
      # 900 = 15 minutes. Default is 3600 (1 hour). SuperTokens recommends <= 1 hour.
      ACCESS_TOKEN_VALIDITY: ${SUPERTOKENS_ACCESS_TOKEN_VALIDITY_SECONDS:-900}
      # Refresh token lifetime in minutes (Core-owned; Session.init cannot override).
      # 10080 = 7 days. Default is 144000 (100 days).
      # @see https://supertokens.com/docs/post-authentication/session-management/change-session-timeout
      REFRESH_TOKEN_VALIDITY: ${SUPERTOKENS_REFRESH_TOKEN_VALIDITY_MINUTES:-10080}
    ports:
      - '127.0.0.1:${SUPERTOKENS_CORE_PORT:-3568}:3567'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:3567/hello || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  sofa_mysql:
  sofa_redis:
  sofa_clamav:
  sofa_minio:
  sofa_postgres_supertokens:
